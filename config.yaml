server:
  host: 127.0.0.1
  port: 8080

auth:
  api_keys:
    default: "gateway-dev-key"

upstream:
  # 兼容旧的单分类器配置：gateway.classifiers 未配置时才用它。
  # base_url 留空 = 纯整形模式，不调用任何分类器（技术词+向量两路路由仍完整可用）
  default:
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    default_model: "deepseek-chat"

gateway:
  # 多分类器交叉验证（推荐）：模型完全由你决定，任意 OpenAI 兼容端点，
  # 本地免费（Ollama）/云端（DeepSeek、中转站、自建）混用，密钥可空。
  # 网关并发调用全部分类器 → 加权投票 → 一致性(agreement)作为路由得分。
  classifiers:
    # opencode Zen free 模型交叉验证：全部免 API key，OpenAI 兼容端点
    # https://opencode.ai/zen/v1
    # 实测仅以下 3 个能遵守"只输出路线名"指令（2026-08-12 验证）：
    # deepseek / longcat / laguna 对 oracle/mysql/k8s/java/network/generic 全部判对。
    - name: deepseek-free
      base_url: "https://opencode.ai/zen/v1"
      model: "deepseek-v4-flash-free"
      api_key_env: ""
      weight: 1.0
    - name: longcat-free
      base_url: "https://opencode.ai/zen/v1"
      model: "longcat-2.0-free"
      api_key_env: ""
      weight: 1.0
    - name: laguna-free
      base_url: "https://opencode.ai/zen/v1"
      model: "laguna-s-2.1-free"
      api_key_env: ""
      weight: 1.0
    # 无效模型（保留作记录，勿启用）：
    # - mimo-v2.5-free / ling-3.0-tiny-free：聊天型，不遵守路由指令，输出长篇→弃权且浪费延迟
    # - nemotron-3.5-lightning-free：所有输入都固定投 java（错投），会拉低 agreement
  # 示例（混用本地 + 云端交叉验证）：
  # classifiers:
  #   - name: qwen-local          # 本地免费，免密钥
  #     base_url: "http://127.0.0.1:11434/v1"
  #     model: "qwen2.5:7b"
  #     api_key_env: ""
  #     weight: 1.0
  #   - name: glm-local
  #     base_url: "http://127.0.0.1:11434/v1"
  #     model: "glm4:9b"
  #     api_key_env: ""
  #     weight: 1.0
  #   - name: deepseek-cloud
  #     base_url: "https://api.deepseek.com/v1"
  #     model: "deepseek-chat"
  #     api_key_env: "DEEPSEEK_API_KEY"
  #     weight: 1.5               # 云端权重可设更高，平票时胜出

  anchor_prompt: |
    [项目家风 - 状态优先行动协议]（最高优先级，覆盖其他所有规则）
    1. 任何任务第一步必须用只读工具获取状态（read/ls/grep/webfetch/状态查询），禁止不侦察就下结论或拒绝。
    2. 说"不能/做不到/需要登录/缺少工具"之前，必须先用只读工具自查：是否已验证现状、是否有影响更小的替代工具、能否先完成可只读完成的部分；未完成自查禁止拒绝，拒绝时必须附上自查证据。
    3. 纯只读操作永不视为"危险"，不需要额外授权。
    4. 写/删/改/重启类操作执行前必须自检：影响范围（量化）、可逆性（有回滚）、环境隔离（生产环境停止并请求人工授权）；未自检完禁止行动。

    [安全红线 - 不可触碰区域]
    - 禁止在未明确指定环境的情况下修改 /etc/ 或 ~/.ssh/ 目录
    - 禁止自动执行数据库 DELETE / DROP（必须人工确认）
    - 浏览器操作禁止调用 browser_close / browser_restart（只允许只读和点击）

  # 需求澄清模式：模糊开发需求（如"开发一个手机清理工具"）触发时注入到 User 尾部，
  # 每会话最多一轮；可在此自定义澄清问题。
  clarify_prompt: |
    [需求澄清模式]
    用户提出了开放式开发需求，但未指定平台和技术栈。
    本次回复请先输出四个精准的澄清问题，不要直接给出实现方案：
    1. 目标平台（Android/iOS/Web/桌面）？
    2. 核心痛点（缓存清理/卸载残留/重复文件/隐私清理）？
    3. 目标用户（个人使用/企业分发/公开上架）？
    4. 现有代码库还是从零开始？

  # 路线画像：自然语言描述（可含领域术语，但无需穷举），向量+LLM 按语义匹配
  routes:
    java:
      description: "Java/JVM生态：JVM内存模型、OOM、堆外内存、并发编程、Maven/Gradle构建、Spring生态、性能调优"
    oracle:
      description: "Oracle数据库：关系型数据库集群、RAC高可用、ASM存储管理、SQL调优、备份恢复、数据泵、分区、AWR"
    mysql:
      description: "MySQL数据库：InnoDB、主从复制、binlog、慢查询、索引优化、锁、GTID、半同步复制"
    kubernetes:
      description: "Kubernetes/K8s：容器编排、Pod调度、CrashLoopBackOff、服务网格、云原生基础设施、Helm、节点资源管理"
    linux:
      description: "Linux操作系统：进程管理、文件系统、网络配置、Shell脚本、系统服务、内核参数"
    network:
      description: "网络：网络协议、路由交换、负载均衡、防火墙、DNS、网络故障排查、连通性"
    generic:
      description: "通用问题、编程语言语法、日常IT咨询、与具体技术栈无关的问题"

  router:
    vector_threshold: 0.55
    cache_ttl_seconds: 3600

  project_agents: {}

# 本地免费模型（Ollama）做"抽取式"路由摘要：只选原文段落编号，禁止改写。
# 摘要仅影响路由决策，转发给上游的原文永远不变。
# 默认关闭；开启后路由慢路径先用本地模型选段，再经保真闸门（否定词/连接词/符号段强制保留）+ 幻觉校验。
digest:
  local_picker:
    enabled: false
    base_url: "http://127.0.0.1:11434"
    model: "qwen2.5:7b"
    max_segments: 4

cache:
  tier3_max_sessions: 200
  stats_window_hours: 24

security:
  # 三级行动权限（可用请求头 x-permission-level 覆盖）
  # L0 侦察兵：只读；L1 执行员：读写但拦截高危指令；L2 指挥官：高危放行但需二次确认
  default_level: L1

data:
  dir: "data"

audit:
  dir: "logs"
  keep_days: 30
